<!-- Bindory demo: connect the wireframe to the real backend, without changing how it looks.
     - Its Log in / Sign up sheet signs in for real (Supabase: Google, or a 6-digit email code),
       then hands back to the wireframe's own flow (onboarding for sign up, welcome back for log in).
     - When you're signed in, everything you type or tap in Ask Mori (shortcuts, suggestions and the
       Take a photo option) goes to the real Mori agent (/api/mori-chat), and replies are drawn with the
       wireframe's own chat bubbles and confirmation card.
     Everything else is the wireframe's own markup, styles and script. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
(() => {
  const P = window.cpProto;
  const app = document.getElementById("cp-app");
  if (!P || !app || !window.supabase) return;

  const sb = window.supabase.createClient(
    "https://auiwcpwphlzipfuzdoan.supabase.co",
    "sb_publishable_VxXGcKFvZiQVbWExEnDw5g_C-3H-K1q",
    { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "implicit" } },
  );
  let session = null;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const fresh = async () => (session = (await sb.auth.getSession()).data.session);
  window.bdLive = { sb, signedIn: () => !!session };

  /* ---------------- Sign-in ---------------- */
  let passThrough = false;
  sb.auth.onAuthStateChange((_event, s) => { session = s; });
  // An email link that was already used comes back as #error=...; offer a fresh code instead.
  const hash = new URLSearchParams(location.hash.slice(1));
  const linkFailed = hash.get("error_code") || hash.get("error");
  fresh().then((s) => {
    if (s) P.open("mori"); // signed in: skip the guest screen, as the wireframe does after sign-in
    else if (linkFailed) {
      history.replaceState(null, "", location.pathname);
      P.toast("That sign-in link expired. Tap Log in for a new code.");
    }
  });

  document.addEventListener("click", async (e) => {
    const verify = e.target.closest("[data-bd-verify]");
    const back = e.target.closest("[data-bd-back]");
    if (verify || back) {
      e.stopImmediatePropagation(); e.preventDefault();
      const card = (verify || back).closest(".cp-auth-card");
      if (back) return restoreSheet(card);
      const email = card.dataset.bdEmail;
      const code = (card.querySelector("[data-bd-code]").value || "").replace(/\D/g, "");
      if (code.length < 6) return P.toast("Enter the code from the email");
      verify.disabled = true; verify.textContent = "Checking…";
      const { error } = await sb.auth.verifyOtp({ email, token: code, type: "email" });
      verify.disabled = false; verify.textContent = "Continue";
      if (error) return P.toast("That code didn't work. Check it, or send a new one.");
      await fresh();
      const original = card.querySelector('[data-auth-provider="email"]');
      restoreSheet(card);
      passThrough = true; original.click(); // the wireframe's own sign-up / log-in flow continues
      return;
    }

    const btn = e.target.closest("[data-auth-provider]");
    if (!btn || !app.contains(btn)) return;
    if (passThrough) { passThrough = false; return; }
    const card = btn.closest(".cp-auth-card");
    if (btn.dataset.authProvider === "Google") {
      e.stopImmediatePropagation(); e.preventDefault();
      await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + "/" } });
      return;
    }
    const email = (card.querySelector("[data-auth-email]").value || "").trim();
    if (!email) return; // the wireframe asks for an email itself
    e.stopImmediatePropagation(); e.preventDefault();
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Sending your code…";
    const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + "/" } });
    btn.disabled = false; btn.textContent = label;
    if (error) return P.toast(/rate|security/i.test(error.message) ? "Too many emails just now. Try again in a minute." : "Could not send the code. Please try again.");
    showCodeStep(card, email);
  }, true);

  function showCodeStep(card, email) {
    card.dataset.bdEmail = email;
    [...card.children].forEach((el) => { if (!el.matches(".cp-auth-close, .cp-mori-face")) { el.dataset.bdHidden = ""; el.hidden = true; } });
    const step = document.createElement("div");
    step.dataset.bdCodeStep = "";
    step.innerHTML =
      "<b>Check your email</b><small>We sent a 6-digit code to " + esc(email) + ".</small>" +
      '<input class="cp-auth-email-input" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="6-digit code" aria-label="Code from the email" data-bd-code>' +
      '<button class="cp-auth-email" type="button" data-bd-verify>Continue</button>' +
      '<button class="cp-auth-switch" type="button" data-bd-back>Use a different email</button>';
    step.style.display = "contents";
    card.append(step);
    step.querySelector("[data-bd-code]").focus();
  }
  function restoreSheet(card) {
    card.querySelector("[data-bd-code-step]")?.remove();
    card.querySelectorAll("[data-bd-hidden]").forEach((el) => { el.hidden = false; delete el.dataset.bdHidden; });
  }

  /* ---------------- Ask Mori ---------------- */
  // Mori's text may use **bold** and [label](link); show it as plain wireframe text.
  const fmt = (t) => esc(t).replace(/(^|\n)[ \t]*[*-][ \t]+/g, "$1• ").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g, "$1$2").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/\n+/g, "<br>");
  const row = (k, v, muted) => "<li><small>" + esc(k) + "</small><b" + (muted ? ' class="is-muted"' : "") + ">" + esc(v) + "</b></li>";
  const cardImg = (c) => (c && /^https:\/\/assets\.tcgdex\.net\//.test(c.image || "") ? c.image : "");

  // Order cards the collector can still change before confirming: id -> { side, price, days, ... }.
  const orders = new Map();
  const currencySymbols = { USD: "US$", AUD: "A$", CAD: "C$", GBP: "£", EUR: "€" };
  const orderMoney = (amount, currency) => (currencySymbols[currency] || currency + " ") + Number(amount).toLocaleString("en-US", { minimumFractionDigits: Math.round(amount * 100) % 100 ? 2 : 0, maximumFractionDigits: 2 });
  function orderComparison(o) {
    const ref = o.reference;
    if (ref === undefined) return o.market ? row("Market reference", "About " + orderMoney(o.market * o.rate, o.currency)) : ""; // legacy card
    if (!ref) return row("Market comparison", "No market reference is available.");
    const target = ref.currency === o.currency ? o.price : ref.currency === "USD" ? o.usd : null;
    const value = orderMoney(ref.amount, ref.currency);
    return row("Market comparison", target === null ? "The market reference is " + value + " in a different currency." :
      "Your target is " + (target === ref.amount ? "at" : target < ref.amount ? "below" : "above") + " the market reference of " + value + ".");
  }
  const orderRows = (o) =>
    row(o.side === "buy" ? "Buy for up to" : "Sell for at least", orderMoney(o.price, o.currency)) +
    (o.currency !== "USD" ? row("US$ equivalent", orderMoney(o.usd, "USD")) : "") +
    orderComparison(o) +
    row("Watching", "Listings and collectors you follow") + row("Expires", "In " + o.days + " days") + (o.note ? row("Note", o.note) : "");
  const orderHead = (o) => "<small>" + (o.side === "buy" ? "Buy order" : "Sell order") + " · price alert</small><b>" + esc(o.name) + "</b>";

  const proposals = new Map(); // id -> tool, for the next steps after Confirm
  const niceDate = (d) => {
    const t = /^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d + "T12:00:00") : null;
    return t && !isNaN(t) ? t.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : d;
  };
  // The order card shows only the overall condition (e.g. Near mint). The detailed checks behind it
  // (centering, each corner, edges, surface) stay with the order for Mori's own assessment.
  function conditionRows(c) {
    return c && c.overall ? row("Condition", c.overall) : "";
  }
  // The collector's private order photos: short-lived signed links, only for their own files.
  async function fillPhotos(el) {
    const imgs = el ? [...el.querySelectorAll("img[data-bd-photo]")] : [];
    if (!imgs.length) return;
    const { data } = await sb.storage.from("memory-photos").createSignedUrls(imgs.map((i) => i.dataset.bdPhoto), 3600);
    (data || []).forEach((d, i) => { if (d && d.signedUrl && imgs[i]) imgs[i].src = d.signedUrl; });
  }
  // Cards confirmed with a binder go into it (a new binder is made first), under the collector's own rules (RLS).
  const binderPlans = new Map();
  async function placeInBinder(plan) {
    const uid = session.user.id;
    const card = await sb.from("cards").select("id").eq("tcgdex_id", plan.tcgdex).limit(1);
    if (card.error || !card.data.length) throw new Error("card");
    let binderId = plan.binder.id;
    if (!binderId) {
      const mine = await sb.from("binders").select("id, name");
      const same = (mine.data || []).find((b) => b.name.trim().toLowerCase() === plan.binder.name.trim().toLowerCase());
      if (same) binderId = same.id;
      else {
        const made = await sb.from("binders").insert({ user_id: uid, name: plan.binder.name }).select("id").single();
        if (made.error) throw made.error;
        binderId = made.data.id;
      }
    }
    const cardId = card.data[0].id;
    const have = await sb.from("binder_cards").select("id").eq("binder_id", binderId).eq("card_id", cardId).limit(1);
    if (have.error) throw have.error;
    if (have.data.length) return "already";
    const count = await sb.from("binder_cards").select("id", { count: "exact", head: true }).eq("binder_id", binderId);
    const ins = await sb.from("binder_cards").insert({ user_id: uid, binder_id: binderId, card_id: cardId, position: count.count || 0 });
    if (ins.error) throw ins.error;
  }
  function proposalHTML(p, id) {
    proposals.set(id, p.tool);
    const done = p.status !== "pending";
    let head = "", rows = "", art = "";
    if (p.tool === "add_card_to_collection" || p.tool === "add_to_wishlist") {
      head = "<small>" + (p.tool === "add_to_wishlist" ? "Wish list" : "New card") + "</small><b>" + esc(p.card.name) + "</b>";
      art = cardImg(p.card) ? '<div class="cp-mori-ident"><img src="' + esc(cardImg(p.card)) + '" alt=""><div><small>Catalogue result</small><b>' + esc(p.card.name) + "</b><span>" + esc(p.card.set_name || "") + "</span></div></div>" : "";
      rows = row("Card", p.card.name) + row("Set", p.card.set_name || "Not listed", !p.card.set_name) + (p.binder ? row("Binder", p.binder.new ? p.binder.name + " (new binder)" : p.binder.name) : "") + (p.card.reason ? row("Why", p.card.reason) : "") + (p.note ? row("Note", p.note) : "");
      if (p.binder && p.tool === "add_card_to_collection" && !done) binderPlans.set(id, { binder: p.binder, tcgdex: p.card.tcgdex_id });
    } else if (p.tool === "create_binder") {
      head = "<small>New binder · Private</small><b>" + esc(p.name) + "</b>";
      art = '<div style="display:flex;gap:6px;overflow-x:auto;margin:8px 0">' + (p.cards || []).map((c) => (cardImg(c) ? '<img src="' + esc(cardImg(c)) + '" alt="' + esc(c.name) + '" style="height:84px;border-radius:6px">' : "")).join("") + "</div>";
      rows = row("Cards", String((p.cards || []).length)) + (p.description ? row("About", p.description) : "");
    } else if (p.tool === "set_order") {
      const o = { side: p.side === "sell" ? "sell" : "buy", price: p.price?.amount ?? p.price_usd, currency: p.price?.currency || "USD", usd: p.price_usd, rate: p.fx_rate || 1, days: p.expires_days || 30, market: p.market_usd, reference: p.market_reference, note: p.note, name: p.card.name, hasPhotos: !!(p.photos?.front && p.photos?.back), condition: p.condition };
      if (!done) orders.set(id, o);
      head = orderHead(o);
      art = cardImg(p.card) ? '<div class="cp-mori-ident"><img src="' + esc(cardImg(p.card)) + '" alt=""><div><small>' + esc(p.card.set_name || "") + "</small><b>" + esc(p.card.name) + "</b></div></div>" : "";
      // A sell order shows the collector's own photos (kept for the listing) and the condition read from them.
      if (p.photos && p.photos.front && p.photos.back)
        art += '<div class="cp-mori-photos"><span><img data-bd-photo="' + esc(p.photos.front) + '" alt="Card front"><i>Front</i></span><span><img data-bd-photo="' + esc(p.photos.back) + '" alt="Card back"><i>Back</i></span></div>';
      rows = orderRows(o) + conditionRows(p.condition) + (p.photos ? row("Photos", "Front and back, saved for your listing") : "");
    } else if (p.tool === "save_memory") {
      head = "<small>New memory · Private</small><b>" + esc(p.title) + "</b>";
      // A trade shows both cards; otherwise the one card the memory is about.
      // A trade shows both sides, even when one card is not in the catalogue (shown by its name).
      const gave = p.traded_card ? { name: p.traded_card.name, image: cardImg(p.traded_card) } : p.traded_card_name ? { name: p.traded_card_name, image: "" } : null;
      const got = p.card ? { name: p.card.name, image: cardImg(p.card) } : p.card_name ? { name: p.card_name, image: "" } : null;
      if (gave && got && P.tradePairHTML)
        art = P.tradePairHTML(gave, got);
      else if (p.card && cardImg(p.card))
        art = '<div class="cp-mori-ident"><img src="' + esc(cardImg(p.card)) + '" alt=""><div><small>' + esc(p.card.set_name || "") + "</small><b>" + esc(p.card.name) + "</b></div></div>";
      // Only the card they gave (e.g. a trade-up game they lost).
      else if (gave && !got)
        art = '<div class="cp-mori-ident">' + (gave.image ? '<img src="' + esc(gave.image) + '" alt="">' : "") + "<div><small>Card you gave</small><b>" + esc(gave.name) + "</b></div></div>";
      rows = row("Story", p.story) + row("With", p.with_whom || "Not added", !p.with_whom) + row("Where", p.place || "Not added", !p.place) + row("When", p.date ? niceDate(p.date) : "Not added", !p.date) + (gave && got ? "" : p.card ? row("Card", p.card.name) : gave ? row("Card you gave", gave.name) : "");
    }
    return '<p>Here it is. Nothing is saved until you confirm.</p>' + art +
      '<div class="cp-mori-confirm"><div class="cp-mori-confirm-head">' + head + "</div><ul>" + rows + "</ul>" +
      '<div class="cp-mori-actions"><button class="cp-mori-go" data-bd-confirm="' + id + '"' + (done ? " disabled" : "") + ">" + (p.status === "confirmed" ? "Saved" : "Confirm") + '</button><button data-bd-edit="' + id + '"' + (done ? " disabled" : "") + ">Change details</button></div></div>";
  }

  // A live price check, all in the collector's currency. Today: the cheapest listing worldwide, the
  // cheapest in their country and the 7-day change, with both listings and the last-5-sold average
  // on one scale. Then recent sales in their country (last 3 and last 5).
  // Older cards (before listings) kept the converted US points: lowest listing, market, mid.
  function priceCardHTML(p) {
    const s = p.scale || {}, c = p.card || {}, sold = p.sold, L = p.listings;
    const country0 = p.market ? p.market.country || "" : "";
    const last5 = sold && sold.raw && typeof sold.raw.avg_last_3 === "number" ? sold.raw.avg_last_3 : null;
    const pts = L
      ? [["Lowest listing (worldwide)", L.world && (L.world.total || L.world.price)], ["Lowest in " + (country0 || "your country"), L.local && (L.local.total || L.local.price)], ["Last 3 sold", last5]].filter((x) => typeof x[1] === "number")
      : [["Lowest listing", s.low], ["Market price", s.market], ["Mid price", s.mid]].filter((x) => typeof x[1] === "number");
    if (!pts.length && !sold && !L) return "";
    // New cards carry prices already in the collector's currency (p.market); older ones are US$.
    const usd = (n) => localMoney(n, p.market ? { symbol: p.market.symbol, rate: 1 } : MKT);
    const vals = pts.map((x) => x[1]), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const at = (v) => 4 + Math.round(((v - lo) / span) * 92);
    // The big dot is the typical price: the last 5 sales (older cards: the market price).
    const isMain = (x) => x[0] === "Market price" || x[0] === "Last 3 sold";
    const dot = (x) => '<i title="' + esc(x[0]) + '" style="position:absolute;top:50%;left:' + at(x[1]) + '%;width:' + (isMain(x) ? 12 : 8) + "px;height:" + (isMain(x) ? 12 : 8) + 'px;border-radius:50%;transform:translate(-50%,-50%);background:' + (isMain(x) ? "#674fd0" : "#fff") + ';border:2px solid #674fd0;box-sizing:border-box;z-index:' + (isMain(x) ? 2 : 1) + '"></i>';
    const soldVal = (x) => (x ? (typeof x.value === "number" ? x.value : typeof x.value_usd === "number" ? x.value_usd : null) : null);
    const soldText = (x) => !x ? "No recent sales" : soldVal(x) !== null ? usd(soldVal(x)) + (x.status === "thin" ? "<small>few sales</small>" : "") : typeof x.last_sale_usd === "number" ? "<small>Last sale</small>" + usd(x.last_sale_usd) : "No recent sales";
    // Recent sales are from sellers in the collector's own country (older cards: read from the eBay site).
    const SITE_COUNTRY = { "ebay.com": "United States", "ebay.co.uk": "United Kingdom", "ebay.de": "Germany", "ebay.fr": "France", "ebay.it": "Italy", "ebay.es": "Spain", "ebay.ca": "Canada", "ebay.com.au": "Australia" };
    const soldCountry = p.market ? p.market.country || SITE_COUNTRY[p.market.ebay] || "" : "";
    const headline = typeof p.headline === "number" ? p.headline : typeof s.market === "number" ? s.market : vals.length ? vals[0] : sold && soldVal(sold.raw) !== null ? soldVal(sold.raw) : null;
    const kicker = (t) => '<small style="display:block;margin:9px 10px 0;font-size:7.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6853d3">' + t + "</small>";
    const scaleBar = pts.length > 1 ? '<div style="position:relative;height:6px;margin:12px 12px 6px;border-radius:3px;background:linear-gradient(90deg,#e4e0ff,#9a88ef)">' + pts.map(dot).join("") + "</div>" : "";
    const ch = L && typeof L.change7 === "number" ? L.change7 : null;
    // "None listed" only when today's listings were read and none was the card; "–" when not read.
    const none = L && L.read === false ? "–" : "None listed";
    const delivered = (x) => !x || typeof x.total !== "number" ? "" : '<em style="display:block;font-style:normal;font-size:6.5px;line-height:1.3;margin-top:2px;color:var(--mori-muted,#6b7090)">' + (x.import_fees > 0 ? "from " + esc(x.from || "overseas") + ", incl. postage + est. import tax & fees" : "incl. postage") + "</em>";
    // Last 3 sold in their country; older cards may only carry a last-5 average.
    const sold3 = sold && sold.raw ? (typeof sold.raw.avg_last_3 === "number" ? sold.raw.avg_last_3 : null) : null;
    const nSold = sold && sold.raw && sold.raw.sales ? sold.raw.sales : 0;
    const listed = L
      ? kicker("Listing and Sold" + (sold && sold.condition ? " · " + esc(sold.condition) : "")) + scaleBar +
        (pts.length > 1 ? '<p style="margin:0 12px 2px;font-size:7px;color:var(--mori-muted,#6b7090)"><b style="color:#674fd0">●</b> Last 3 sold &nbsp; <b style="color:#674fd0">○</b> Lowest listings, delivered</p>' : "") +
        '<div class="cp-val-values">' +
        // Delivered prices: item + postage, plus estimated import tax and fees for items from abroad.
        "<span><small>Lowest listing<br>(worldwide)</small><b>" + (L.world ? usd(L.world.total || L.world.price) : none) + "</b>" + delivered(L.world) + "</span>" +
        "<span><small>Lowest listing<br>(" + esc(country0 || "your country") + ")</small><b>" + (L.local ? usd(L.local.total || L.local.price) : none) + "</b>" + delivered(L.local) + "</span>" +
        "<span><small>Last 3 sold<br>(" + esc(country0 || "your country") + ")</small><b>" + (sold3 !== null ? usd(sold3) : "No recent sales") + "</b>" + (sold3 !== null && nSold && nSold < 3 ? '<em style="display:block;font-style:normal;font-size:6.5px;line-height:1.3;margin-top:2px;color:var(--mori-muted,#6b7090)">' + nSold + " sale" + (nSold === 1 ? "" : "s") + "</em>" : "") + "</span></div>"
      : "";
    return '<div class="cp-val"><div class="cp-val-head"><small>Mori market check</small><b>' +
      esc((c.name || "") + (c.number ? " " + c.number : "")) + (headline !== null ? " · " + usd(headline) : "") + "</b><span>" + esc([c.set, c.rarity].filter(Boolean).join(" · ")) + "</span></div>" +
      listed + (!L && pts.length ? '<small style="display:block;margin:9px 10px 0;font-size:7.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6853d3">Raw, ungraded · today</small>' +
        '<div style="position:relative;height:6px;margin:12px 12px 6px;border-radius:3px;background:linear-gradient(90deg,#e4e0ff,#9a88ef)">' + pts.map(dot).join("") + "</div>" +
        '<div class="cp-val-values">' + pts.map((x) => "<span><small>" + esc(x[0]) + "</small><b>" + usd(x[1]) + "</b></span>").join("") + "</div>" : "") +
      (sold && !L ? '<small style="display:block;margin:4px 10px 0;font-size:7.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6853d3">Recent sales' + (soldCountry ? " (" + esc(soldCountry) + ")" : "") + '</small>' +
        (sold.raw && ("avg_last_3" in sold.raw || "avg_last_5" in sold.raw || "avg_last_10" in sold.raw)
          // Average of the last 3 and last 5 sales (older price cards in History: last 10).
          ? '<table class="bd-sold"><thead><tr><th>' + (sold.condition ? "Condition" : "") + '</th><th>Last 3 sold</th><th>Last 5 sold</th></tr></thead><tbody>' +
            // One row per condition: the one the collector picked (older cards: raw NM and graded).
            (sold.condition ? [[esc(sold.condition), sold.raw]] : [["Raw NM", sold.raw], ["PSA 9", sold.psa9], ["PSA 10", sold.psa10]]).filter(([, x]) => x).map(([label, x]) => {
              // Always last 3 and last 5; older cards (last 10 only) show a dash for last 5.
              const last = x && x.avg_last_5, three = x && (typeof x.avg_last_3 === "number" ? x.avg_last_3 : last);
              const has = typeof three === "number";
              const n = x && x.sales ? x.sales : 0;
              return "<tr><th>" + label + "</th>" + (has
                ? "<td>" + usd(three) + (n && n < 3 ? "<small>" + n + " sale" + (n === 1 ? "" : "s") + "</small>" : "") + "</td><td>" + (typeof last === "number" ? usd(last) + (n && n < 5 ? "<small>" + n + " sale" + (n === 1 ? "" : "s") + "</small>" : "") : "–") + "</td>"
                : '<td colspan="2" class="is-none">No recent sales</td>') + "</tr>";
            }).join("") + "</tbody></table>"
          : '<div class="cp-val-values">' + [["Raw NM", sold.raw], ["PSA 9", sold.psa9], ["PSA 10", sold.psa10]].map((x) => "<span><small>" + x[0] + "</small><b>" + soldText(x[1]) + "</b></span>").join("") + "</div>") : "") +
      "</div>";
  }

  // Tickets for an event: the collector picks a ticket type and quantity, then opens the organiser's
  // own checkout and pays there. Bindory never takes the payment or sees the card.
  function ticketsHTML(t) {
    let host = "";
    try { host = new URL(t.url).hostname.replace(/^www\./, ""); } catch {}
    const opts = (t.options || []).map((o, i) =>
      '<label class="bd-tix-opt"><input type="radio" name="bd-tix-' + esc(String(Date.now())) + '" value="' + i + '"' + (i === 0 ? " checked" : "") + ">" +
      "<span><b>" + esc(o.name) + "</b>" + (o.note ? "<small>" + esc(o.note) + "</small>" : "") + "</span>" + (o.price ? "<i>" + esc(o.price) + "</i>" : "") + "</label>").join("");
    return '<div class="bd-tix" data-bd-tix="' + esc(t.url) + '" data-bd-tix-options="' + esc(JSON.stringify(t.options || [])) + '">' +
      '<small class="bd-tix-kicker">Tickets</small><b class="bd-tix-event">' + esc(t.event) + "</b>" +
      (t.date || t.venue ? "<p class=\"bd-tix-when\">" + esc([t.date, t.venue].filter(Boolean).join(" · ")) + "</p>" : "") +
      (opts ? '<div class="bd-tix-opts">' + opts + "</div>" : "") +
      '<div class="bd-tix-qty"><span>Tickets</span><button type="button" data-bd-tix-step="-1" aria-label="One fewer">−</button><b data-bd-tix-n>1</b><button type="button" data-bd-tix-step="1" aria-label="One more">+</button></div>' +
      '<div class="cp-mori-actions"><button class="cp-mori-go" data-bd-tix-go>Go to checkout</button></div>' +
      '<p class="cp-mori-sample">Opens ' + esc(host || "the organiser's site") + ". You pay there; Bindory never sees your card.</p></div>";

  app.addEventListener("click", (e) => {
    const box = e.target.closest && e.target.closest("[data-bd-tix]");
    if (!box || !app.contains(box)) return;
    const step = e.target.closest("[data-bd-tix-step]"), go = e.target.closest("[data-bd-tix-go]");
    const nEl = box.querySelector("[data-bd-tix-n]");
    if (step) { nEl.textContent = String(Math.min(10, Math.max(1, Number(nEl.textContent) + Number(step.dataset.bdTixStep)))); return; }
    if (!go) return;
    e.stopPropagation();
    let options = [];
    try { options = JSON.parse(box.dataset.bdTixOptions || "[]"); } catch {}
    const pick = options[Number((box.querySelector("input[type=radio]:checked") || {}).value || 0)];
    const n = Number(nEl.textContent) || 1;
    const what = (pick ? pick.name : "your ticket") + " × " + n;
    window.open(box.dataset.bdTix, "_blank", "noopener");
    let note = box.querySelector(".bd-tix-picked");
    if (!note) { note = document.createElement("p"); note.className = "bd-tix-picked"; box.querySelector(".cp-mori-actions").after(note); }
    note.innerHTML = "On the organiser's page, choose <b>" + esc(what) + "</b>" + (pick && pick.price ? " (" + esc(pick.price) + " each)" : "") + ", then pay there.";
    try { navigator.clipboard && navigator.clipboard.writeText(what); } catch {}
  });

  // Markdown from the sync agent: headings, tables, lists, bold. Escaped first; links show as text.
  function mdHTML(t) {
    const inline = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
    const lines = String(t || "").split("\n"), out = [];
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
        const cells = (x) => x.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        let h = "<div class=\"bd-md-table\"><table><thead><tr>" + cells(l).map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
        i += 2;
        for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) h += "<tr>" + cells(lines[i]).map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>";
        i--; out.push(h + "</tbody></table></div>"); continue;
      }
      const hd = /^\s*#{1,4}\s+(.*)$/.exec(l);
      if (hd) { out.push("<h4>" + inline(hd[1]) + "</h4>"); continue; }
      const li = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(l);
      if (li) { out.push("<p class=\"bd-md-li\">• " + inline(li[1]) + "</p>"); continue; }
      if (l.trim()) out.push("<p>" + inline(l) + "</p>");
    }
    return out.join("");
  }
  // A Collectr sync card asks the server for progress until the agent is done, then shows its
  // answer, its files and "Add these cards".
  async function syncCall(id, action, extra) {
    await fresh();
    if (!session) throw new Error("signed out");
    return fetch("/api/mori-sync", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: JSON.stringify(Object.assign({ id, action }, extra || {})) });
  }
  function watchSync(card) {
    if (!card || card.dataset.watching) return;
    card.dataset.watching = "1";
    const id = card.dataset.bdSync, status = card.querySelector(".bd-sync-status"), box = card.querySelector(".bd-sync-result");
    let misses = 0;
    const started = Date.now();
    const tick = async () => {
      if (!card.isConnected) return;
      try {
        const res = await syncCall(id, "status");
        if (!res.ok) throw new Error(String(res.status));
        const s = await res.json();
        misses = 0;
        if (!s.done) {
          const mins = Math.floor((Date.now() - started) / 60000);
          status.innerHTML = '<i class="bd-spin"></i>' + esc(s.progress || "Reading your Collectr collection") + "…" + (mins ? " (" + mins + " min)" : "");
          setTimeout(tick, 5000); return;
        }
        status.textContent = s.status === "completed" ? "Done" : "Stopped before the end";
        card.dataset.binder = s.binder || "";
        box.innerHTML = mdHTML(s.content) +
          (s.files.length ? '<div class="bd-sync-files"><small>Files</small>' + s.files.map((f) => '<button data-bd-sync-file="' + f.n + '">' + esc(f.filename.split("/").pop()) + "</button>").join("") + "</div>" : "") +
          (s.applied ? appliedHTML(s.applied, s.binder) : s.items ? '<div class="cp-mori-actions"><button class="cp-mori-go" data-bd-sync-apply>Add ' + s.items + " card" + (s.items === 1 ? "" : "s") + (s.binder ? " to " + esc(s.binder) : "") + "</button></div>" : "");
        app.querySelector("[data-mori-thread]") && card.scrollIntoView({ block: "nearest" });
      } catch {
        if (++misses < 6) setTimeout(tick, 8000);

  }
  function appliedHTML(a, binder) {

      (a.unmatched && a.unmatched.length ? '<p class="cp-mori-sample">Not added (no exact catalogue match): ' + a.unmatched.map(esc).join(", ") + "</p>" : "");

  app.addEventListener("click", async (e) => {

  });

  // The base renderers own the chip and tile markup. Tag only the action for this price card.
  function withGradeIntent(html, attr, question, card) {
    if (!card || (!card.id && !card.name)) return html;
    const t = document.createElement("template"); t.innerHTML = html;
    const button = [...t.content.querySelectorAll("button[" + attr + "]")].find(b => b.getAttribute(attr) === question);
    if (!button) return html;
    const printing = card.id ? { id: card.id } : { name: card.name, ...(card.number ? { number: card.number } : {}), ...(card.set ? { set: card.set } : {}) };
    button.dataset.bdIntent = JSON.stringify({ kind: "pre_grade", card: printing });
    return t.innerHTML;
  }

  function renderRows(rows, ui, steps) {
    steps = [...new Set(steps)];
    // The steps ("Searching the web" ...) show only while Mori works, in the typing bubble; the
    // finished answer is shown without them.
    let stepsHTML = "";
    let last = null, lastKind = "", priceCard = null;
    for (const r of rows) {
      if (r.role !== "mori" || r.kind === "status") continue;
      if (r.kind === "choices") {
        // Mori asked a question: its likely answers, one tap each (like option cards).
        const list = (r.payload && r.payload.choices) || [];
        if (list.length) {
          const html = '<div class="bd-choices">' + list.map((c) => {
            const label = typeof c === "string" ? c : c.label;
            if (typeof c === "string" && /…$|\.\.\.$/.test(c)) return '<button type="button" class="bd-choice is-own" data-bd-choice-own>' + esc(label) + "</button>";
            const intent = c && c.intent ? ' data-bd-intent="' + esc(JSON.stringify(c.intent)) + '"' : "";
            return '<button type="button" class="bd-choice" data-mori-ask="' + esc(label) + '"' + intent + '>' + esc(label) + "</button>";
          }).join("") + "</div>";
          if (last) last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", html);
          else last = ui.say(html);
          // Only this live response's printing choices may reuse this order's pair.
          if (ui.sellShots) last.querySelectorAll(".bd-choices:last-child button[data-bd-intent]").forEach(b => choicePhotos.set(b, ui.sellShots));
          ui.scrollDown();
        }
        continue;
      }
      if (r.kind === "suggest") {
        // Follow-up questions go under the last bubble of this answer.
        const list = (r.payload && r.payload.suggestions) || [];
        if (list.length && P.nextUpHTML) {
          const chips = withGradeIntent(P.nextUpHTML(list), "data-mori-ask", "Pre-grade this card", lastKind === "price" && priceCard);
          if (last) last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", chips);
          else ui.say(chips);
          ui.scrollDown();
        }
        continue;
      }
      if (r.kind === "tickets" && r.payload && r.payload.url) {
        const card = ticketsHTML(r.payload);
        if (last && lastKind === "text") last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", card);
        else last = ui.say(stepsHTML + card);
        lastKind = "tickets"; continue;
      }
      if (r.kind === "sync") { last = ui.say(stepsHTML + '<div class="bd-sync" data-bd-sync="' + esc(r.id) + '"><small>Collectr sync</small><p class="bd-sync-status"><i class="bd-spin"></i>' + esc(r.content) + '</p><div class="bd-sync-result"></div></div>'); watchSync(last.querySelector("[data-bd-sync]")); lastKind = "sync"; continue; }
      if (r.kind === "confirm" && r.payload) { last = ui.say(stepsHTML + proposalHTML(r.payload, r.id)); fillPhotos(last); }
      else if (r.kind === "photos") {
        // Take a photo / Upload send the front and back for a sell order or a pre-grade (the wireframe's own photo step).
        const why = r.payload && r.payload.for === "grade" ? "grade" : "sell";
        const pending = r.payload?.intent ? ' data-bd-pending-intent="' + esc(JSON.stringify(r.payload.intent)) + '"' : "";
        const btns = '<div class="cp-mori-chips"' + pending + '><button data-mori-act="card-photo" data-mori-arg="' + why + '">Take a photo</button><button data-mori-act="card-photo" data-mori-arg="' + why + '">Upload from my photos</button></div>';
        if (last && lastKind === "text") last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", btns);
        else last = ui.say(stepsHTML + btns);
      }
      else if (r.kind === "people" && r.payload && P.peopleHTML) {
        const cards = P.peopleHTML(r.payload.people || []);
        if (last && lastKind === "text") last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", cards);
        else last = ui.say(stepsHTML + cards);
      }
      else if (r.kind === "video" && r.payload && P.videoPlanHTML) {
        const board = P.videoPlanHTML(r.payload);
        if (last && lastKind === "text") last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", board);
        else last = ui.say(stepsHTML + board);
        videos.set(String(videos.size), r.payload);
        last.querySelector("[data-video-plan]:not([data-video-key])")?.setAttribute("data-video-key", String(videos.size - 1));
      }
      else if (r.kind === "binders" && r.payload && P.binderPickHTML) {
        const list = P.binderPickHTML(r.payload);
        if (last && lastKind === "text") last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", list);
        else last = ui.say(stepsHTML + list);
      }
      else if (r.kind === "orders" && r.payload && P.ordersListHTML) {
        // Mori's one-line summary and the order cards share one bubble.
        const list = P.ordersListHTML(r.payload.orders || []);
        if (last && lastKind === "text") last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", list);
        else last = ui.say(stepsHTML + list);
        if (last) { (r.payload.orders || []).forEach(o => showOrderStatus(last, o)); refreshOrders(last); }
      }
      else if (r.kind === "price" && r.payload) {
        // Mori's reply and the price card share one bubble.
        priceCard = r.payload.card;
        const card = priceCardHTML(r.payload);
        if (last && lastKind === "text") last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", card);
        else last = ui.say(stepsHTML + card);
      }
      else if (r.kind === "grade" && r.payload && P.gradeReportHTML) {
        const [should, take] = P.gradeReportHTML(r.payload);
        // Mori's own intro line and the "Should I grade?" card share one bubble.
        if (last && lastKind === "text") last.querySelector(".cp-mori-body").insertAdjacentHTML("beforeend", should);
        else ui.say(stepsHTML + should);
        const raw = r.payload.raw_price;
        const reference = raw ? "Raw price: " + orderMoney(raw.amount, raw.currency) : r.payload.price_note;
        last = ui.say(take + (reference ? '<p class="cp-grade-notes">' + esc(reference) + '</p>' : ""));
      }
      else last = ui.say(stepsHTML + "<p>" + fmt(r.content) + "</p>");
      lastKind = r.kind;
      stepsHTML = "";
    }
  }

  // Each visit and each "New chat" starts a fresh conversation for Mori (the server only sends it
  // messages after this time). A few seconds back, so a slightly fast phone clock cannot hide the first message.
  let chatSince = new Date(Date.now() - 5000).toISOString();
  app.addEventListener("click", (e) => { if (e.target.closest("[data-mori-reset]")) { chatSince = new Date(Date.now() - 5000).toISOString(); attachedShot = null; } }, true);
  app.addEventListener("cp:mori-new-chat", () => { chatSince = new Date().toISOString(); attachedShot = null; });

  // Card photos: "Take a photo" opens the phone's camera, "Upload from my photos" and the photo
  // icon in the chat box open its photo album. The picker is opened in the tap itself (a capture
  // listener, before the wireframe's own handler), because phones only open it during a tap.
  // Price checks and adding a card need only the front; pre-grades and sell orders need the back too.
  const picker = document.createElement("input");
  picker.type = "file"; picker.accept = "image/*"; picker.tabIndex = -1; picker.setAttribute("aria-hidden", "true");
  picker.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
  document.body.append(picker);
  let pickDone = null;
  function pickImages(camera, multiple) {
    if (pickDone) pickDone(null);
    picker.value = "";
    if (camera) picker.setAttribute("capture", "environment"); else picker.removeAttribute("capture");
    picker.multiple = Boolean(multiple);
    const p = new Promise((resolve) => { pickDone = (v) => { pickDone = null; resolve(v); }; });
    picker.click();
    return p;
  }
  picker.addEventListener("change", () => pickDone && pickDone(picker.files && picker.files.length ? [...picker.files] : null));
  picker.addEventListener("cancel", () => pickDone && pickDone(null));
  async function shrinkImage(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image(); img.src = url; await img.decode();
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.85);
    } catch { return null; } finally { URL.revokeObjectURL(url); }
  }
  // After the front, a small sheet asks for the back (a tap, so the camera or album can open again).
  function askForBack(camera) {
    return new Promise((resolve) => {
      const sheet = document.createElement("div");
      sheet.className = "bd-photo-sheet";
      sheet.innerHTML = '<div><p><b>Front done.</b> Now the back of the card.</p>' +
        '<button data-back-go>' + (camera ? "Take a photo of the back" : "Choose the back photo") + '</button>' +
        '<button data-back-skip>Cancel</button></div>';
      document.body.append(sheet);
      sheet.addEventListener("click", async (e) => {
        if (e.target.closest("[data-back-skip]")) { sheet.remove(); resolve(null); }
        else if (e.target.closest("[data-back-go]")) {
          const p = openPicker(camera, false); sheet.remove();
          const f = await p; resolve(f ? f.slice(0, 1) : null);
        }
      });
    });
  }
  // Phones open their own camera from the file input (capture). Laptops ignore that, so there
  // "Take a photo" opens a live camera view (getUserMedia) with a Capture button instead.
  const isPhone = () => matchMedia("(pointer: coarse)").matches;
  function webcamPhoto() {
    return new Promise((resolve) => {
      const box = document.createElement("div");
      box.className = "bd-photo-sheet bd-cam";
      box.innerHTML = '<div><p><b>Take a photo of the card</b></p><video autoplay playsinline muted></video>' +
        '<p class="bd-cam-msg" hidden></p><button data-cam-snap disabled>Capture</button>' +
        '<button data-cam-file>Choose a photo instead</button><button data-back-skip>Cancel</button></div>';
      document.body.append(box);
      const video = box.querySelector("video"), snap = box.querySelector("[data-cam-snap]"), msg = box.querySelector(".bd-cam-msg");
      let stream = null, done = false;
      const finish = (v) => { if (done) return; done = true; stream && stream.getTracks().forEach((t) => t.stop()); box.remove(); resolve(v); };
      (navigator.mediaDevices && navigator.mediaDevices.getUserMedia
        ? navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
        : Promise.reject(new Error("no camera")))
        .then((s) => { if (done) { s.getTracks().forEach((t) => t.stop()); return; } stream = s; video.srcObject = s; snap.disabled = false; })
        .catch(() => { video.hidden = true; snap.hidden = true; msg.hidden = false; msg.textContent = "Your camera is not available here (no camera, or access was blocked). You can choose a photo instead."; });
      box.addEventListener("click", (e) => {
        if (e.target.closest("[data-back-skip]")) return finish(null);
        if (e.target.closest("[data-cam-file]")) { const p = pickImages(false, false); done = true; stream && stream.getTracks().forEach((t) => t.stop()); box.remove(); p.then(resolve); return; }
        if (e.target.closest("[data-cam-snap]") && stream && video.videoWidth) {
          const c = document.createElement("canvas"); c.width = video.videoWidth; c.height = video.videoHeight;
          c.getContext("2d").drawImage(video, 0, 0);
          c.toBlob((b) => finish(b ? [new File([b], "card.jpg", { type: "image/jpeg" })] : null), "image/jpeg", 0.9);
        }
      });
    });
  }
  // The right picker for a tap: camera (phone camera, or the laptop's live view) or the album/files.
  const openPicker = (camera, multiple) => (camera && !isPhone() ? webcamPhoto() : pickImages(camera, multiple));
  const needsBack = (kind) => kind === "grade" || kind === "sell";
  // The base wireframe calls bdLiveRoute synchronously from its submit/click handler.
  // Bind an intent to that DOM event (not to matching text or the next message).
  let intentEvent = null;
  function tagIntent(event, intent, photos) {
    const entry = { event, intent, photos }; intentEvent = entry;
    setTimeout(() => { if (intentEvent === entry) intentEvent = null; }, 0);
  }
  const conditions = { "Near mint or better": "near_mint", "Lightly played": "lightly_played", "Moderately played": "moderately_played", "Heavily played": "heavily_played" };
  // Photo selection is async; its intent belongs to this exact attachment array.
  const photoIntents = new WeakMap();
  const choicePhotos = new WeakMap();
  let pendingPick = null;
  window.bdPickCardPhotos = async (el, kind, camera = !/upload/i.test(el.textContent || "")) => {
    const p = pendingPick && pendingPick.el === el ? pendingPick.promise : openPicker(camera, !camera && needsBack(kind));
    pendingPick = null;
    let files = await p;
    if (!files) return false;
    files = files.slice(0, needsBack(kind) ? 2 : 1);
    if (needsBack(kind) && files.length < 2) {
      const back = await askForBack(camera);
      if (!back) return false;
      files = files.concat(back);
    }
    const shots = (await Promise.all(files.map(shrinkImage))).filter(Boolean);
    if (shots.length < files.length || !shots.length) { alert("That photo could not be opened. Please try a JPEG or PNG photo."); return false; }
    if (kind === "price") {
      const select = el.closest(".cp-mori-body")?.querySelector('form[data-fill="price"] select[name="condition"]');
      photoIntents.set(shots, { kind: "price_check", condition: conditions[select?.value] });
    }
    const pending = el.closest("[data-bd-pending-intent]");
    if (needsBack(kind) && pending) photoIntents.set(shots, JSON.parse(pending.dataset.bdPendingIntent));
    else if (kind === "grade") photoIntents.set(shots, { kind: "pre_grade" });
    return shots;
  };

  // The photo icon in the chat box: the collector's own photo is attached to the next message.
  // Delay this specific sell submission for its pair. Cancelling leaves the form editable.
  const collectingOrder = new WeakSet();
  async function sendFormOrder(el, order, symbol, done) {
    if (collectingOrder.has(el) || liveRun) return;
    collectingOrder.add(el);
    try {
      let shots;

      (hasBinder ? '<label>Binder<select name="binder"><option value="" disabled selected>Choose a binder</option><option value="__new">+ New binder</option></select></label>' +

      (hasPrice ? '<label>Price<span class="bd-price"><b>US$</b><input name="price" inputmode="decimal" autocomplete="off" placeholder="450" maxlength="10" aria-label="Price in US dollars"></span></label>' : "") +

    document.body.append(box);

    // Focus the field for the blank that was tapped.
    const slotAt = (re) => { const m = re.exec(tpl); return m ? [m.index, m.index + m[0].length] : null; };
    const inSlot = (r) => r && at >= r[0] && at <= r[1];
    const first =
      (inSlot(slotAt(/\[price\]/i)) && el.price) ||
      (inSlot(slotAt(/\[card number\]/i)) && el.num) ||
      [el.name, el.num, el.price].find((x) => x && !(x.value || "").trim());
    inp.blur();
    setTimeout(() => first && first.focus(), 30);
    // Your binders (newest last), then "+ New binder", which shows a name box.
    if (el.binder) {

      fresh().then((s) => s && sb.from("binders").select("name").order("created_at")).then((r) => {
        const names = [...new Set(((r && r.data) || []).map((b) => b.name).filter(Boolean))];
        const add = sel.querySelector('option[value="__new"]');

      const v = el.num.value;

      const num = (el.num?.value || "").trim().toUpperCase(), of = (el.of?.value || "").trim().toUpperCase();

      const bad = (m, field) => { err.textContent = m; err.hidden = false; field && field.focus(); };
      if (el.name && !name) return bad("Type the card's name.", el.name);
      if (el.num && !num) return bad("Type the card number (the first part).", el.num);
      const part = /^[A-Z]{0,4}\d{1,4}[A-Z]?$/;
      if (el.num && (!part.test(num) || (of && !part.test(of)))) return bad("Card numbers look like 125 / 094 (some start with letters, like TG12 / TG30).", el.num);
      if (el.price && !/^\d{1,7}(\.\d{1,2})?$/.test(price)) return bad("Type a price in US dollars, like 450 or 19.99.", el.price);

      const binder = el.binder ? (isNew ? (el.newbinder.value || "").trim().replace(/["“”]/g, "").replace(/\s+/g, " ") : el.binder.value) : "";
      if (el.binder && !el.binder.value) return bad("Choose a binder, or make a new one.", el.binder);
      if (isNew && !binder) return bad("Type a name for the new binder.", el.newbinder);
      const number = of ? num + "/" + of : num;
      const orderTemplate = /^(buy|sell) \[(?:card \+ number|card name\] \[card number)\] for (?:up to|at least) US\$\[price\]$/i.exec(tpl.trim());
      if (orderTemplate) {
        if (!(Number(price) > 0)) return bad("Enter a price above zero.", el.price);
        sendFormOrder(f, {kind:"order",side:orderTemplate[1].toLowerCase(),card:{name,number},price:{amount:Number(price),currency:"USD"}}, "US$", () => box.remove());

        .replace(/\[card \+ number\]/i, name + " " + number)
        .replace(/\[card name\]/i, name)
        .replace(/\[card number\]/i, number)
        .replace(/\[price\]/i, price)
        .replace(/in the binder "\[binder\]"/i, isNew ? 'in a new binder called "' + binder + '"' : 'in the binder "' + binder + '"')
        .replace(/\[binder\]/i, binder)
        .replace(/\s+/g, " ").trim();

      const form = inp.closest("form");
      if (/^price check:?\s+\[(?:card name\]\s+\[card number|card \+ number)\]$/i.test(tpl.trim()))
        tagIntent(e, { kind: "price_check", card: { name, number } });
      if (form && form.requestSubmit) form.requestSubmit(); else inp.focus();
    });

  // Location for "near me" questions (card shows, events, stores). The first time, the phone's own
  // location prompt appears; the place name ("Sydney, New South Wales, Australia") is kept on this

  const NEEDS_LOC = /near me|nearby|around me|close to me|in my (area|city|town)|\blocal (card )?(shops?|stores?|events?)|card shows?|conventions?|meet-?ups?|tournaments?/i;

  const getLoc = () => { try { const v = JSON.parse(localStorage.getItem(LOC_KEY) || "null"); return v && v.place && Date.now() - v.at < 30 * 864e5 ? v : null; } catch { return null; } };
  const setLoc = (place) => { try { localStorage.setItem(LOC_KEY, JSON.stringify({ place, at: Date.now() })); } catch {} };
  let pendingLocQ = "";
  const LOC_HELP = /iPhone|iPad|iPod/.test(navigator.userAgent)
    ? "On your iPhone: Settings, then Privacy &amp; Security, then Location Services: turn it on and set your browser (Safari Websites or Chrome) to <b>While Using the App</b>. In Safari you can also tap <b>aA</b>, then Website Settings, then Location: <b>Allow</b>."
    : /Android/.test(navigator.userAgent)
      ? "On your Android phone: tap the icon next to the web address, then Permissions, then Location: <b>Allow</b>. Also check that Location is on in your phone's quick settings."

  function phonePosition() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) return resolve({ error: "unsupported" });
      navigator.geolocation.getCurrentPosition(
        (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude }),
        (e) => resolve({ error: e.code === 1 ? "denied" : "unavailable" }),
        { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 },
      );
    });
  }
  async function askLocation(ui, question) {

    const body = bubble.querySelector(".cp-mori-body") || bubble;
    ui.scrollDown();
    const pos = await phonePosition();
    if (!pos.error) {
      try {
        const res = await fetch("/api/mori-locate", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: JSON.stringify({ lat: Math.round(pos.lat * 100) / 100, lon: Math.round(pos.lon * 100) / 100 }) });
        if (res.ok) {
          const { place } = await res.json();
          setLoc(place);
          body.innerHTML = "<p>Got it, you are near <b>" + esc(place) + "</b>.</p>" + '<div class="cp-mori-chips"><button data-bd-loc-city>Change my location</button></div>';
          return place;
        }
      } catch {}

      ? "<p>Location is turned off for this site, so I can't see where you are yet.</p><p class=\"cp-mori-sample\">" + LOC_HELP + "</p>"

  /* ---------------- The collector's market: country, currency, eBay site ---------------- */
  const COUNTRY_NAMES = { "united states": "US", "united states of america": "US", usa: "US", "united kingdom": "GB", uk: "GB", england: "GB", scotland: "GB", wales: "GB", germany: "DE", france: "FR", italy: "IT", spain: "ES", canada: "CA", australia: "AU" };
  const TZ_COUNTRY = [[/^Australia\//, "AU"], [/^Europe\/London$/, "GB"], [/^Europe\/(Berlin|Busingen)$/, "DE"], [/^Europe\/Paris$/, "FR"], [/^Europe\/Rome$/, "IT"], [/^(Europe\/Madrid|Atlantic\/Canary|Africa\/Ceuta)$/, "ES"],
    [/^America\/(Toronto|Vancouver|Edmonton|Winnipeg|Halifax|St_Johns|Regina|Montreal|Moncton|Whitehorse|Yellowknife|Iqaluit)$/, "CA"], [/^(America\/|Pacific\/Honolulu)/, "US"]];
  function myCountry() {
    const loc = getLoc && getLoc();

    if (last && COUNTRY_NAMES[last]) return COUNTRY_NAMES[last];
    let tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch {}

  const clip = (t, n) => { t = String(t || "").replace(/\*\*|__|`/g, "").replace(/\s+/g, " ").trim(); return t.length > n ? t.slice(0, n - 1) + "…" : t; };

  // History: one entry per chat, newest first. Each message carries its chat (payload.chat, the

  async function chatsList() {
    const { data } = await sb.from("mori_messages").select("role, kind, content, payload, created_at").order("created_at", { ascending: false }).limit(800);
    const rows = (data || []).slice().reverse(), chats = [];

    const artist = topOf(artists.map((x) => x.a));
    // How they collect: traits from what they do.
    const traits = [];

    if (binders.length >= 2) traits.push("Organises by binder");

      : pricedRows.length >= 2 ? "A market watcher"
      : binders.length >= 2 ? "An organiser"

    if (artist && artist[1] >= 2) {

      ideas.push({ img: cardPic(pic && pic.c.image_url), kicker: "An artist you love", title: "More art by " + artist[0], why: artist[1] + " of your newest cards are theirs.", ask: "Show me every Pokémon card illustrated by " + artist[0] });
    }

    else if (cards[0]) ideas.push({ img: cardPic(cards[0].image_url), kicker: "A story to tell", title: "Save the story of your " + cards[0].name, why: "Your newest card. Where did it come from?", ask: "I want to save a memory about my " + cards[0].name });
    if (species && species[1] >= 2) {

      ideas.push({ img: cardPic(pic && pic.image_url), kicker: "Your favourite Pokémon", title: "More " + species[0] + " cards to chase", why: "You own " + species[1] + " " + species[0] + " cards.", ask: "Which " + species[0] + " cards should I chase next?" });
    }

    if (w) ideas.push({ img: cardPic(w.image_url), kicker: "On your chase list", title: "Chase " + w.name, why: "Set a buy order and Mori watches listings for you.", ask: "Set a buy order for " + w.name });
    const pc = pricedRows[0];
    const gradeAsk = pc && ("Pre-grade my " + pc.name + (pc.number ? " " + pc.number : ""));
    if (pc) ideas.push({ img: cardPic(pc.image), kicker: "Worth a look", title: "Should you grade " + pc.name + "?", why: "You checked its price recently.", ask: gradeAsk });
    const setPic = set && cards.find((c) => c.set_name === set[0] && c.image_url);
    if (set && set[1] >= 3) ideas.push({ img: cardPic(setPic && setPic.image_url), glyph: "◎", kicker: "Complete a set", title: "Fill the gaps in " + set[0], why: set[1] + " of your cards are from this set.", ask: "Which cards would complete my " + set[0] + " collection?" });
    const loc = getLoc();
    ideas.push({ glyph: "⌖", kicker: "Near you", title: loc && loc.place.includes(",") ? "Card shows near " + loc.place.split(",")[0] : "Card shows near you", why: "Dates, tickets and what to bring.", ask: "When is the next card show near me?" });
    if (pricedRows.length >= 2 || (orders.data || []).length) ideas.push({ glyph: "↗", kicker: "Your market", title: "See which of your cards went up", why: "You keep an eye on prices.", ask: "Which of my cards went up in value this month?" });
    if (!cards.length) ideas.push({ glyph: "+", kicker: "Get started", title: "Bring in your cards", why: "Add them one by one, from a photo, or from Collectr.", ask: "Add cards to my collection" });
    const board = P.ideaBoard ? P.ideaBoard({ title, traits: traits.slice(0, 4) }, ideas.slice(0, 8)) : "";

  /* ---------------- Trade-up game (two collectors in person, fair odds) ---------------- */

  const usdT = (n) => { const m = MKT, v = Math.round(Number(n || 0) * (m.rate || 1) * 100) / 100; return m.symbol + v.toLocaleString("en-US", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };

    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || "Something went wrong. Please try again.");
    return out;
  }

    const k = "bd_tradeup_" + id;
    let v = localStorage.getItem(k);
    if (!v) { const b = new Uint8Array(32); crypto.getRandomValues(b); v = hex(b); localStorage.setItem(k, v); }
    return v;
  }
  const tradeupStartHTML = () => '<div class="bd-game" data-bd-game-start><small class="bd-game-kicker">Trade-up game</small>' +

    '<div class="cp-mori-actions"><button class="cp-mori-go" data-bd-game-new>Start a game</button></div>' +
    '<form class="bd-game-join" data-bd-game-join novalidate><input name="code" inputmode="numeric" maxlength="6" placeholder="6-digit code" aria-label="Game code"><button type="submit">Join</button></form>' +

  const games = new Map(); // id -> latest state

  }

      try {

        if (JSON.stringify(n) !== JSON.stringify(g)) paint(box, n);
      } catch {}

    };
