  // Pure NDJSON stream reader for /api/mori-chat: resets its idle timer on every line (including
  // server pings), ignores unknown event types, flushes trailing bytes on EOF, and requires a
  // terminal "done" or "error" event so a dropped or stalled stream never leaves "Thinking" stuck.
  const MORI_STREAM_IDLE_MS = 30000;
  async function readMoriNdjsonStream(body, opts) {
    const idleMs = (opts && opts.idleMs) || MORI_STREAM_IDLE_MS;
    const onEvent = opts && opts.onEvent;
    const signal = opts && opts.signal;
    const reader = body.getReader();
    const dec = new TextDecoder();
    let buf = "", terminal = false, timer = null, rejectIdle = null;
    const clearIdle = () => { if (timer !== null) { clearTimeout(timer); timer = null; } };
    const armIdle = () => {
      clearIdle();
      timer = setTimeout(() => {
        const err = Object.assign(new Error("Mori took too long to respond. Please try again."), { code: "timeout" });
        void reader.cancel().catch(() => {});
        if (rejectIdle) rejectIdle(err);
      }, idleMs);
    };
    const nextChunk = () => new Promise((resolve, reject) => {
      let settled = false;
      const done = (fn) => { if (settled) return; settled = true; rejectIdle = null; signal?.removeEventListener("abort", onAbort); fn(); };
      const onAbort = () => done(() => { void reader.cancel().catch(() => {}); reject(Object.assign(new Error("Aborted"), { name: "AbortError", code: "aborted" })); });
      if (signal && signal.aborted) return onAbort();
      rejectIdle = (err) => done(() => reject(err));
      signal?.addEventListener("abort", onAbort, { once: true });
      reader.read().then((chunk) => done(() => resolve(chunk)), (err) => done(() => reject(err)));
    });
    const handleLine = (line) => {
      const trimmed = line.trim();
      if (!trimmed) return;
      armIdle();
      const ev = JSON.parse(trimmed);
      if (!ev || typeof ev !== "object" || typeof ev.type !== "string") return;
      if (ev.type === "ping") return;
      if (ev.type === "error") {
        terminal = true;
        const msg = typeof ev.text === "string" && ev.text.trim() ? ev.text.trim() : "";
        throw Object.assign(new Error(msg || "Sorry, I could not answer just now. Please try again."), { fromServer: Boolean(msg), code: typeof ev.code === "string" ? ev.code : "error" });
      }
      if (ev.type === "done") { terminal = true; if (onEvent) onEvent(ev); return; }
      if (ev.type === "status" || ev.type === "text") { if (onEvent) onEvent(ev); }
      // Unknown event types are ignored so newer server events never break the client.
    };
    try {
      armIdle();
      for (;;) {
        const { value, done } = await nextChunk();
        if (done) {
          buf += dec.decode();
          if (buf.trim()) handleLine(buf);
          break;
        }
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          handleLine(line);
          if (terminal) break;
        }
        if (terminal) break;
      }
      if (!terminal) {
        throw Object.assign(new Error("Connection dropped before Mori finished. Please try again."), { code: "incomplete_stream" });
      }
    } finally {
      clearIdle();
      void reader.cancel().catch(() => {});
    }
  }

  // Called from the wireframe's own route() (patched at build time) for typed and tapped messages.
  window.bdLiveRoute = async (text, ui) => {
    const submission = intentEvent && intentEvent.event.eventPhase !== Event.NONE ? intentEvent : undefined;
    const intent = photoIntents.get(ui.photos) || submission?.intent;
    intentEvent = null;
    if (submission?.photos) {
      ui.photos = submission.photos;
      const mine = [...app.querySelectorAll("[data-mori-thread] .cp-mori-body")].pop();
      mine?.insertAdjacentHTML("beforeend", window.bdPhotosHTML(ui.photos));
    }
    if (intent?.kind === "order" && intent.side === "sell" && ui.photos?.length === 2) ui.sellShots = ui.photos;
    // A photo attached from the chat box goes with this message and shows in its bubble.
    const shot = attachedShot; attachedShot = null;
    if (shot && !ui.photos && intent?.kind !== "order" && intent?.kind !== "pre_grade") {
      const mine = [...app.querySelectorAll("[data-mori-thread] .cp-mori-body")].pop();
      if (mine) { mine.insertAdjacentHTML("beforeend", '<div class="cp-mori-photos"><span><img src="' + shot + '" alt="Your card"></span></div>'); ui.scrollDown(); }
      ui = Object.assign({}, ui, { photos: [shot] });
    }
    if (!(await fresh())) return false; // guests keep the wireframe's scripted Mori
    // The Trade-up challenge shortcut opens the in-person trade-up game.
    if (/^start a trade-?up (challenge|game)\.?$/i.test(text.trim())) { ui.say(tradeupStartHTML()); ui.scrollDown(); return true; }
    // "Near me" questions need the collector's location first (the phone asks once).
    let loc = getLoc();
    if (!intent && !loc && NEEDS_LOC.test(text)) {
      const place = await askLocation(ui, text);
      if (!place) return true; // waiting for the collector to allow location or type a city
      loc = { place };
    }
    loadMarket();
    const run = new AbortController(); liveRun = run;
    const sendBtn = app.querySelector("[data-mori-send]"), sendHTML = sendBtn && sendBtn.innerHTML;
    if (sendBtn) { sendBtn.innerHTML = STOP_ICON; sendBtn.setAttribute("aria-label", "Stop Mori"); sendBtn.classList.add("is-stop"); }
    const typing = ui.addMsg("mori", '<div class="cp-mori-typing"><i></i><i></i><i></i><span>Thinking</span></div>', "is-typing");
    const steps = [];
    let bubble = null, streamed = "", headerTimedOut = false, headerTimer = null;
    try {
      headerTimer = setTimeout(() => { headerTimedOut = true; run.abort(); }, MORI_STREAM_IDLE_MS);
      const res = await fetch("/api/mori-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token },
        signal: run.signal,
        body: JSON.stringify(Object.assign({ message: text, intent, since: chatSince, country: myCountry() }, loc ? { location: loc.place } : {}, ui.photos && ui.photos.length ? { photos: ui.photos } : {})),
      });
      clearTimeout(headerTimer); headerTimer = null;
      if (!res.ok || !res.body) throw new Error("unavailable");
      await readMoriNdjsonStream(res.body, {
        idleMs: MORI_STREAM_IDLE_MS,
        signal: run.signal,
        onEvent: (ev) => {
          // The status text goes in the typing bubble's label, never in Mori's avatar.
          if (ev.type === "status") { steps.push(ev.text); const label = typing.querySelector(".cp-mori-typing span"); if (label) label.textContent = ev.text; }
          if (ev.type === "text") {
            if (!bubble) { bubble = ui.say("<p></p>"); typing.after(bubble); }
            streamed += ev.text; bubble.querySelector("p").innerHTML = fmt(streamed.replace(/(^|\n|(?<=[.?!])[ \t]+)[ \t*_]*(suggestions?|choices?)[ \t*_]*:[\s\S]*$/i, "")); ui.scrollDown();
          }
          if (ev.type === "done") { typing.remove(); bubble?.remove(); bubble = null; renderRows(ev.rows, ui, steps); }
        },
      });
    } catch (err) {
      typing.remove(); bubble?.remove();
      if (run.signal.aborted && !headerTimedOut) {
        ui.say('<p class="cp-mori-sample">Stopped.</p>');
      } else if (err && err.fromServer && err.message) {
        ui.say("<p>" + esc(err.message) + "</p>");
      } else if (headerTimedOut || (err && err.code === "timeout")) {
        ui.say("<p>Mori took too long to respond. Please try again.</p>");
      } else if (err && err.code === "incomplete_stream") {
        ui.say("<p>Connection dropped before Mori finished. Please try again.</p>");
      } else {
        ui.say("<p>Sorry, I could not answer just now. Please try again.</p>");
      }
      ui.scrollDown();
    } finally {
      if (headerTimer !== null) clearTimeout(headerTimer);
      if (liveRun === run) liveRun = null;
      if (sendBtn) { sendBtn.innerHTML = sendHTML; sendBtn.setAttribute("aria-label", "Send to Mori"); sendBtn.classList.remove("is-stop"); }
    }
    typing.remove();
    return true;
  };

  /* ---------------- The wireframe's demo, plus your own activity ---------------- */
  // The wireframe's sample content IS the demo and stays exactly as designed (Wing, 422 followers,
  // the slab grails, Search's collectors and binders, posts). On top of it we add only what you do in
  // the demo: cards, binders, memories and wish-list cards Mori saves, follows, saved binders,
  // check-ins and the points they earn. It's stored in your account, so it's there next time too.
  const keyFor = (id) => "r" + String(id).replace(/-/g, "");
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const COLORS = ["purple", "pink", "blue"];
  const S0 = P.S;
  const BASE = {
    points: S0.points, followers: S0.followers, following: S0.following, streak: S0.streak,
    binders: S0.binders.slice(), memories: S0.memories.slice(), saved: S0.savedBinders.slice(),
    followingSet: new Set(S0.followingSet), wish: window.bdL ? window.bdL.wish.slice() : [],
    posts: window.bdPOSTS ? window.bdPOSTS.slice() : [], reels: window.bdREELS ? window.bdREELS.slice() : [],
  };
  window.bdCollectorIds = {}; // wireframe collector name -> real account id (Follow)
  window.bdBinderIds = {}; // wireframe public binder key -> real binder id (Save binder)
  const plain = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

  function addCard(key, c) {
    const meta = [c.set_name, c.number && "#" + c.number].filter(Boolean).join(" · ");
    P.CARDS[key] = {
      name: c.name, glyph: "✦", meta, type: c.rarity || "", artist: c.illustrator || "Unknown artist",
      set: c.set_name || "", theme: "", note: "", home: "", img: key,
      caption: [c.name, c.rarity, [c.set_name, c.number].filter(Boolean).join(" ")].filter(Boolean).join(" · "),
    };
    if (c.image_url) P.IMG[key] = c.image_url;
  }

  function replaceProfileText(name) {
    const root = app.querySelector('[data-screen="profile"]');
    if (!root || !name) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const n = walker.currentNode;
      const v = n.nodeValue.replace(/Wing Wu/g, name);
      if (v !== n.nodeValue) n.nodeValue = v;
    }
  }

  async function loadMyData() {
    if (!(await fresh())) return;
    const uid = session.user.id;
    const prof = await sb.from("profiles").select("display_name, settings").eq("id", uid).maybeSingle();
    // Everything before the demo collection was loaded is the database's own sample; the wireframe
    // already shows the demo, so only count what happened after.
    const since = (prof.data && prof.data.settings && prof.data.settings.demo_loaded) || "1970-01-01T00:00:00Z";
    const after = (q) => q.gt("created_at", since);
    const [cards, binders, links, mems, wish, pts, fers, fo, sv, checks, posts, cols, bins] = await Promise.all([
      after(sb.from("cards").select("*").eq("user_id", uid)).order("created_at", { ascending: false }),
      after(sb.from("binders").select("id, name, description, is_public, cover_image").eq("user_id", uid)).order("created_at"),
      sb.from("binder_cards").select("binder_id, card_id, position").eq("user_id", uid).order("position"),
      after(sb.from("memories").select("*").eq("user_id", uid)).order("created_at", { ascending: false }),
      after(sb.from("wishlist").select("*").eq("user_id", uid)).order("created_at", { ascending: false }),
      after(sb.from("points_events").select("points").eq("user_id", uid)),
      sb.from("follows").select("follower_id", { count: "exact", head: true }).eq("followee_id", uid),
      sb.from("follows").select("followee_id").eq("follower_id", uid),
      sb.from("saved_binders").select("binder_id").eq("user_id", uid),
      sb.from("check_ins").select("day").eq("user_id", uid),
      after(sb.from("posts").select("*").eq("user_id", uid)).order("created_at", { ascending: false }),
      sb.rpc("list_public_collectors", { p_query: "" }),
      sb.rpc("list_public_binders", { p_query: "" }),
    ]);
    const S = P.S;

    // Map the wireframe's collectors and public binders to the real ones with the same name,
    // so Follow and Save binder are stored for real.
    if (Array.isArray(cols.data))
      for (const c of cols.data) {
        const first = (c.display_name || c.username || "").split(" ")[0];
        if (P.COLLECTORS[first]) window.bdCollectorIds[first] = c.id;
      }
    if (Array.isArray(bins.data))
      for (const b of bins.data) {
        if (b.is_mine) continue;
        const k = Object.keys(P.PB).find((key) => plain(P.PB[key].name) === plain(b.name));
        if (k) window.bdBinderIds[k] = b.id;
      }

    // Cards and binders you added in the demo
    const byId = new Map();
    for (const c of cards.data || []) { const k = keyFor(c.id); addCard(k, c); byId.set(c.id, k); }
    const newBinders = (binders.data || []).map((b, i) => ({
      id: keyFor(b.id), name: b.name, type: b.description || "Binder", privacy: b.is_public ? "Public" : "Private",
      color: COLORS[i % COLORS.length], cover: b.cover_image ? { type: "img", src: b.cover_image } : null, coverNote: "Binder cover",
      cards: (links.data || []).filter((l) => l.binder_id === b.id).map((l) => byId.get(l.card_id)).filter(Boolean), extra: 0,
    }));
    S.binders = BASE.binders.concat(newBinders);
    const inNew = new Set(newBinders.flatMap((b) => b.cards));
    S.loose = [...byId.values()].filter((k) => !inNew.has(k));

    // Memories and wish-list cards you added
    const newMems = (mems.data || []).map((m) => {
      const d = m.happened_on ? new Date(m.happened_on + "T00:00:00Z") : new Date(m.created_at);
      return {
        id: keyFor(m.id), prompt: 0, title: m.title, card: "", day: String(d.getUTCDate()),
        month: MONTHS[d.getUTCMonth()], year: String(d.getUTCFullYear()), occasion: m.place || "", text: m.note || "",
      };
    });
    S.memories = newMems.concat(BASE.memories);
    if (window.bdL)
      window.bdL.wish = (wish.data || []).map((w) => {
        const k = keyFor(w.id);
        addCard(k, { name: w.name, image_url: w.image_url, set_name: "", rarity: "" });
        return k;
      }).concat(BASE.wish);

    // Points, follows, saves, check-ins: the demo's numbers plus yours
    P.setPoints(BASE.points + (pts.data || []).reduce((n, p) => n + p.points, 0));
    S.followers = BASE.followers + (fers.count || 0);
    const followedIds = new Set((fo.data || []).map((r) => r.followee_id));
    const followedNames = Object.keys(window.bdCollectorIds).filter((n) => followedIds.has(window.bdCollectorIds[n]));
    S.followingSet = new Set([...BASE.followingSet, ...followedNames]);
    S.following = BASE.following + followedNames.filter((n) => !BASE.followingSet.has(n)).length;
    const savedIds = new Set((sv.data || []).map((r) => r.binder_id));
    const savedKeys = Object.keys(window.bdBinderIds).filter((k) => savedIds.has(window.bdBinderIds[k]));
    S.savedBinders = [...new Set([...savedKeys, ...BASE.saved])];
    const today = new Date().toISOString().slice(0, 10);
    S.checkedIn = (checks.data || []).some((c) => c.day === today);
    S.streak = BASE.streak + (S.checkedIn ? 1 : 0);

    // Posts you created in the demo, before the demo's own
    if (window.bdPOSTS && window.bdREELS) {
      const KIND = { post: "Post", video: "Video", story_card: "Story card", recap: "Recap", cover: "Binder cover" };
      const mine = (posts.data || []).map((p) => {
        const k = "rpo" + keyFor(p.id);
        P.IMG[k] = p.media_url || (p.body && p.body.frames && p.body.frames[0] && p.body.frames[0].image) || (p.body && p.body.image) || "";
        return { p, k };
      }).filter((x) => P.IMG[x.k]);
      window.bdPOSTS.splice(0, window.bdPOSTS.length, ...mine.map(({ p, k }) => ({ img: k, kind: KIND[p.kind] || "Post", video: p.kind === "video", caption: p.caption || "" })), ...BASE.posts);
      window.bdREELS.splice(0, window.bdREELS.length, ...mine.filter(({ p }) => p.kind === "video").map(({ p, k }) => ({ img: k, source: p.made_with_mori ? "Made with Mori" : "Uploaded", length: "0:15", views: "New", caption: p.caption || "" })), ...BASE.reels);
    }

    // Your name in the greetings and profile header
    const name = (prof.data && prof.data.display_name) || "";
    if (name) { window.bdFirstName = name.split(" ")[0]; replaceProfileText(name); }

    // Redraw with the wireframe's own renderers
    for (const fn of ["renderMyBinder", "renderJourney", "renderProfile", "renderFeed"]) try { P[fn](); } catch {}
    for (const r of ["collection", "home", "profile", "mori-room"]) try { P.R[r] && P.R[r](); } catch {}
  }


  // Follow, Save binder and Check in also write to your account (the wireframe updates its own screen).
  document.addEventListener("click", (e) => {
    if (!session) return;
    const uid = session.user.id;
    const S = P.S;
    const fail = ({ error }) => { if (error && error.code !== "23505") P.toast("Could not save that. Please try again."); };
    const f = e.target.closest("[data-follow-name],[data-follow-collector],[data-follow-owner]");
    if (f && app.contains(f)) {
      const name = f.dataset.followName || ("followCollector" in f.dataset ? S.currentCollector : P.PB[S.currentPB]?.owner);
      const id = window.bdCollectorIds[name];
      if (id) {
        const follow = !S.followingSet.has(name);
        (follow
          ? sb.from("follows").insert({ follower_id: uid, followee_id: id })
          : sb.from("follows").delete().eq("follower_id", uid).eq("followee_id", id)).then(fail);
      }
    }
    const sv = e.target.closest("[data-save-binder]");
    if (sv && app.contains(sv)) {
      const k = S.currentPB, id = window.bdBinderIds[k];
      if (id) {
        const save = !S.savedBinders.includes(k);
        (save
          ? sb.from("saved_binders").insert({ user_id: uid, binder_id: id })
          : sb.from("saved_binders").delete().eq("user_id", uid).eq("binder_id", id)).then(fail);
      }
    }
    const ci = e.target.closest("[data-check-in],[data-home-checkin],[data-room-checkin]");
    if (ci && app.contains(ci) && !S.checkedIn) sb.from("check_ins").insert({ user_id: uid }).then(fail);
  }, true);

  window.bdLive.reload = loadMyData;
  // Order alerts and the demo payment method (setup/010). Only a label is stored, never payment details.
  const paymentLabels = { card: "Debit or credit card", crypto: "Crypto wallet", paypal: "PayPal", google_pay: "Google Pay" };
  const paymentReminder = "You have pending orders. Add a payment method to make them live.";
  function afterOrderConfirm(order, status, uid) {
    if (status === "pending") pendingOrderStep("alerts", uid);
    else if (!status && P.orderNext) setTimeout(() => {
      if (session?.user.id === uid) P.orderNext({ side: order.side, card: order.name, price: order.price, days: order.days });
    }, 500);
  }
  function pendingOrderStep(step, uid) {
    if (session?.user.id !== uid) return;
    const settings = P.orderSettings || {};
    const button = (key, label, primary) => '<button type="button" data-bd-payment="' + key + '"' + (primary ? ' class="cp-mori-go"' : '') + '>' + label + '</button>';
    let body, actions;
    if (step === "alerts") {
      const option = (key, label, checked) => '<label class="cp-order-opt"><input type="checkbox" data-bd-alert="' + key + '"' + (checked ? ' checked' : '') + '><span><b>' + label + '</b></span><i aria-hidden="true"></i></label>';
      body = '<small>1 of 2</small><b>Choose your notification preferences</b>' +
        option("push", "Phone notification", settings.alert_push !== false) + option("email", "Email", !!settings.alert_email);
      actions = button("alerts", "Save preferences", true) + button("skip-alerts", "Not now");
    } else if (step === "wallet") {
      const group = "bd-wallet-" + crypto.randomUUID();
      body = '<small>2 of 2</small><b>Connect a payment method</b><p>Connect to activate all your pending, unexpired orders.</p><div class="cp-order-wallets">' +
        Object.entries(paymentLabels).map(([key, label]) => '<label><input type="radio" name="' + group + '" value="' + key + '"' +
          (key === (settings.wallet || "card") ? ' checked' : '') + '><span><b>' + label + '</b></span></label>').join("") +
        '</div><p class="cp-order-demo">Demo only. Nothing is charged and no payment details are collected.</p>';
      actions = button("connect", "Connect", true) + button("skip-wallet", "Skip for now");
    } else {
      body = "<b>" + (step === "reminder" ? paymentReminder : "Payment skipped. Your order stays pending until you connect a payment method.") + "</b>";
      actions = button("wallet", "Add payment method", true);
    }
    P.moriUI.say('<div class="cp-order-step" data-bd-payment-step="' + step + '" data-bd-payment-owner="' + esc(uid) + '">' + body + '<div class="cp-mori-actions">' + actions + '</div></div>');
  }
  app.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-bd-payment]");
    if (!b || b.disabled) return;
    const box = b.closest("[data-bd-payment-owner]"), uid = box.dataset.bdPaymentOwner;
    if (session?.user.id !== uid) return;
    const controls = box.querySelectorAll("button,input");
    const lock = (value) => controls.forEach(el => el.disabled = value);
    lock(true);
    const action = b.dataset.bdPayment;
    try {
      if (action === "alerts") {
        let push = box.querySelector('[data-bd-alert="push"]').checked;
        const email = box.querySelector('[data-bd-alert="email"]').checked;
        if (push) {
          try { push = "Notification" in window && await Notification.requestPermission() === "granted"; }
          catch { push = false; }
        }
        if (session?.user.id !== uid) return;
        const prefs = { alert_push: push, alert_email: email };
        const { error } = await sb.from("order_settings").upsert({ user_id: uid, ...prefs, updated_at: new Date().toISOString() });
        if (error) throw error;
        if (session?.user.id !== uid) return;
        Object.assign(P.orderSettings, prefs);
      }
      if (action === "connect") {
        const wallet = box.querySelector("input:checked").value;
        const { data, error } = await sb.rpc("connect_order_payment", { p_wallet: wallet });
        if (error || !Array.isArray(data?.activated_ids)) throw new Error("activation not confirmed");
        if (session?.user.id !== uid) return;
        P.orderSettings.wallet = wallet;
        const n = data.activated_ids.length;
        P.moriUI.say("<p>" + (n === 1 ? "Payment method connected. One order is now live." : n ? "Payment method connected. " + n + " orders are now live." : "Payment method connected. No pending orders needed activation.") + "</p>");
        app.querySelectorAll('[data-bd-payment-step="reminder"],[data-bd-payment-step="pending"]').forEach(el => el.closest(".cp-mori-msg")?.remove());
        refreshOrders(app);
      } else {
        pendingOrderStep(action === "skip-wallet" ? "pending" : "wallet", uid);
      }
    } catch {
      if (session?.user.id !== uid) return;
      lock(false);
      P.toast(action === "connect" ? "Could not confirm activation. Try Connect again." : "Could not save notification preferences. Try again or choose Not now.");
    }
  });

  let orderSettingsOwner = null;
  async function loadOrderSettings() {
    const uid = session?.user.id;
    if (!uid || orderSettingsOwner === uid) return;
    orderSettingsOwner = uid;
    P.orderSettings = {};
    const [settings, pending] = await Promise.all([
      sb.from("order_settings").select("alert_push, alert_email, wallet").eq("user_id", uid).maybeSingle(),
      sb.from("market_orders").select("id").eq("user_id", uid).eq("status", "pending").gt("expires_at", new Date().toISOString()).limit(1),
    ]);
    if (session?.user.id !== uid || orderSettingsOwner !== uid) return;
    if (settings.data) Object.assign(P.orderSettings, settings.data);
    if (!pending.data?.length) return;
    // Email-code auth signs in before the base closes its sheet and resets Mori's thread.
    // Mutation delivery is after that reset. Do not consume the device reminder before then.
    const sheet = app.querySelector("[data-auth-sheet].is-open");
    if (sheet) {
      await new Promise(resolve => {
        const observer = new MutationObserver(() => {
          if (!sheet.classList.contains("is-open")) { observer.disconnect(); resolve(); }
        });
        observer.observe(sheet, { attributes: true, attributeFilter: ["class"] });
      });
      if (session?.user.id !== uid || orderSettingsOwner !== uid) return;
    }
    pendingOrderStep("reminder", uid);
    if (!P.orderSettings.alert_push || !("Notification" in window) || Notification.permission !== "granted") return;
    try {
      const key = "bd-payment-reminder:" + uid, now = Date.now();
      if (now - Number(localStorage.getItem(key)) < 864e5) return;
      localStorage.setItem(key, String(now));
      new Notification("Mori", { body: paymentReminder });
    } catch { /* Local storage or device notifications may be unavailable. */ }
  }
  app.addEventListener("cp:order-settings", async (e) => {
    if (!(await fresh())) return;
    const { error } = await sb.from("order_settings").upsert({ user_id: session.user.id, ...e.detail, updated_at: new Date().toISOString() });
    if (error) console.warn("Order settings not saved", error.message);
  });
  fresh().then((s) => s && loadOrderSettings());
  sb.auth.onAuthStateChange((event) => {
    if (event === "SIGNED_IN") setTimeout(loadOrderSettings, 0);
    if (event === "SIGNED_OUT") { orderSettingsOwner = null; P.orderSettings = {}; }
  });
  fresh().then((s) => s && loadMyData());
  sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_IN") setTimeout(loadMyData, 0); });

  // Paint saved status immediately, then reconcile history cards with their current state.
  function showOrderStatus(el, o) {
    for (const item of el.querySelectorAll('[data-order-id="' + CSS.escape(o.id) + '"]')) {
      const label = item.querySelector("span small"), side = label.textContent.split(" · ")[0];
      const days = Math.ceil((Date.parse(o.expires_at) - Date.now()) / 864e5);
      if (o.status === "cancelled" || o.status === "filled" || days <= 0) {
        label.textContent = side;
        markClosed(item, o.status === "cancelled" ? "Cancelled" : o.status === "filled" ? "Filled" : "Expired");
      } else if (o.status === "pending") label.textContent = side + " · Pending payment";
      else if (o.status === "open") label.textContent = side + " · " + days + (days === 1 ? " day" : " days") + " left";
    }
  }
  async function refreshOrders(el) {
    const ids = [...el.querySelectorAll("[data-order-id]")].map((x) => x.dataset.orderId);
    if (!ids.length) return;
    const { data } = await sb.from("market_orders").select("id, status, expires_at").in("id", ids);
    (data || []).forEach(o => showOrderStatus(el, o));
  }
  function markClosed(item, status) {
    if (!item) return;
    item.classList.remove("is-asking");
    item.classList.add("is-cancelled");
    item.querySelector(".cp-order-item-act").innerHTML = "<mark>" + esc(status) + "</mark>";
  }
  // Post or save a video Mori storyboarded (posts table, owner-only by RLS).
  const videos = new Map();
  app.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-bd-video-post],[data-bd-video-draft]");
    if (!b || !app.contains(b)) return;
    e.stopPropagation();
    const board = b.closest("[data-video-plan]"), v = videos.get(board.dataset.videoKey);
    if (!v) return;
    const pub = "bdVideoPost" in b.dataset;
    board.querySelectorAll(".cp-mori-actions button").forEach((x) => (x.disabled = true));
    await fresh();
    const { error } = await sb.from("posts").insert({
      user_id: session.user.id, kind: "video", caption: v.title, media_url: v.frames[0].image,
      body: { frames: v.frames }, made_with_mori: true, is_public: pub,
    });
    if (error) { board.querySelectorAll(".cp-mori-actions button").forEach((x) => (x.disabled = false)); P.toast("Could not save that. Please try again."); return; }
    b.textContent = pub ? "Posted" : "Saved";
    P.toast(pub ? "Posted to your profile" : "Saved as a draft");
    loadMyData();
    const body = b.closest(".cp-mori-body");
    body?.querySelectorAll(".cp-mori-next").forEach((x) => x.remove());
    if (body && P.nextUpHTML) body.insertAdjacentHTML("beforeend", P.nextUpHTML(pub ? ["Plan another video", "Build a binder for these cards", "Which collectors share my taste?"] : ["Plan another video", "Build a binder for these cards"]));
  });

  // Add here on a binder Mori suggested: put the collector's own card into that binder.
  app.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-bd-binder-add]");
    if (!b || !app.contains(b)) return;
    e.stopPropagation();
    const item = b.closest("[data-binder-id]"), list = b.closest("[data-binder-card]");
    const binderId = item.dataset.binderId, cardId = list.dataset.binderCard;
    list.querySelectorAll("[data-bd-binder-add]").forEach((x) => (x.disabled = true));
    await fresh();
    const have = await sb.from("binder_cards").select("id").eq("binder_id", binderId).eq("card_id", cardId).limit(1);
    let error = have.error;
    const already = !error && have.data.length > 0;
    if (!already && !error) {
      ({ error } = await sb.from("binder_cards").insert({ user_id: session.user.id, binder_id: binderId, card_id: cardId, position: Number(item.dataset.binderCount) || 0 }));
    }
    if (error) { list.querySelectorAll("[data-bd-binder-add]").forEach((x) => (x.disabled = false)); P.toast("Could not add it. Please try again."); return; }
    item.querySelector(".cp-order-item-act").innerHTML = "<mark>" + (already ? "Already here" : "Added") + "</mark>";
    list.querySelectorAll("[data-bd-binder-add]").forEach((x) => x.closest(".cp-order-item").classList.add("is-done"));
    const name = item.querySelector("b").textContent;
    P.toast(already ? "It is already in " + name : "Added to " + name);
    loadMyData();
    const body = b.closest(".cp-mori-body");
    body?.querySelectorAll(".cp-mori-next").forEach((x) => x.remove());
    if (body && P.nextUpHTML) body.insertAdjacentHTML("beforeend", P.nextUpHTML(["Plan a video of this binder", "Price check this card", "Add another card"]));
  });

  // Cancel a pending or open order after confirmation (owner-only by RLS).
  app.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-bd-order-cancel],[data-bd-order-yes],[data-bd-order-keep]");
    if (!b || !app.contains(b)) return;
    e.stopPropagation();
    const item = b.closest("[data-order-id]"), act = item.querySelector(".cp-order-item-act");
    if ("bdOrderCancel" in b.dataset) {
      item.classList.add("is-asking");
      act.innerHTML = "<p>Cancel this order?</p><button data-bd-order-keep>Keep it</button><button class=\"is-danger\" data-bd-order-yes>Yes, cancel</button>";
      return;
    }
    if ("bdOrderKeep" in b.dataset) {
      item.classList.remove("is-asking");
      act.innerHTML = "<button data-bd-order-cancel>Cancel</button>";
      return;
    }
    act.querySelectorAll("button").forEach((x) => (x.disabled = true));
    await fresh();
    const { data, error } = await sb.from("market_orders").update({ status: "cancelled" }).eq("id", item.dataset.orderId).in("status", ["open", "pending"]).gt("expires_at", new Date().toISOString()).select("id").maybeSingle();
    if (!data || error) { act.querySelectorAll("button").forEach((x) => (x.disabled = false)); refreshOrders(app); P.toast("Could not cancel that. Please try again."); return; }
    showOrderStatus(item.parentElement, {id:data.id, status:"cancelled"});
    P.toast("Order cancelled");
  });

  // Change details on an order card opens an editor in the card; nothing is sent until Confirm.
  app.addEventListener("click", (e) => {
    const save = e.target.closest("[data-order-save],[data-order-cancel]");
    if (!save || !app.contains(save)) return;
    e.stopPropagation();
    const card = save.closest(".cp-mori-confirm"), ed = save.closest("[data-order-edit]");
    const id = card.querySelector("[data-bd-confirm]").dataset.bdConfirm, o = orders.get(id);
    if ("orderSave" in save.dataset && o) {
      const price = Number(ed.querySelector("[data-order-price]").value);
      if (!(price > 0 && Number(price.toFixed(2)) === price && Math.round(price / o.rate * 100) >= 1 && Math.round(price / o.rate * 100) <= 100000000)) { P.toast("Enter a valid price in " + o.currency); return; }
      o.side = ed.querySelector("[data-order-side].is-selected")?.dataset.orderSide === "sell" ? "sell" : "buy";
      o.days = Number(ed.querySelector("[data-order-days].is-selected")?.dataset.orderDays) || 30;
      o.price = Math.round(price * 100) / 100;
      o.usd = Math.round(Math.round(price * 100) / o.rate) / 100;
      o.changed = true;
      card.querySelector(".cp-mori-confirm-head").innerHTML = orderHead(o);
      card.querySelector("ul").innerHTML = orderRows(o) + conditionRows(o.condition) + (o.hasPhotos ? row("Photos", "Front and back, saved for your listing") : "");
      P.toast("Order updated. Tap Confirm to set it.");
    }
    ed.remove();
    card.querySelector("ul").hidden = false;
    card.querySelector(".cp-mori-actions").hidden = false;
  });

  // Confirm / Change details on Mori's real proposals.
  app.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-bd-confirm],[data-bd-edit]");
    if (!b) return;
    e.stopPropagation();
    const action = "bdConfirm" in b.dataset ? "confirm" : "edit";
    const id = b.dataset.bdConfirm || b.dataset.bdEdit;
    const box = b.closest(".cp-mori-actions");
    const order = orders.get(id);
    if (action === "edit" && order && P.orderEditorHTML) {
      const card = b.closest(".cp-mori-confirm");
      card.querySelector("ul").hidden = true;
      box.hidden = true;
      box.insertAdjacentHTML("afterend", P.orderEditorHTML(order));
      const field = card.querySelector("[data-order-price]");
      field.parentNode.firstChild.textContent = currencySymbols[order.currency] || order.currency;
      field.min = "0.01"; field.max = "9999999.99"; field.step = "0.01";
      if (!order.hasPhotos) card.querySelector('[data-order-side="sell"]').disabled = true;
      field.focus();
      return;
    }
    box.querySelectorAll("button").forEach((x) => (x.disabled = true));
    try {
      await fresh();
      const confirmOwner = session.user.id;
      const res = await fetch("/api/mori-confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token },
        body: JSON.stringify({ messageId: id, action, ...(order && order.changed ? { changes: { side: order.side, price: order.price, expires_days: order.days } } : {}) }),
      });
      if (res.status === 409) { box.querySelectorAll("button").forEach(x => { x.disabled = false; }); P.toast(await res.text()); return; }
      if (!res.ok) throw new Error("failed");
      const out = await res.json();
      if (session?.user.id !== confirmOwner) return;
      const plan = action === "confirm" ? binderPlans.get(id) : null;
      if (plan) {
        binderPlans.delete(id);
        try { P.toast((await placeInBinder(plan)) === "already" ? "It is already in " + plan.binder.name : "Added to " + plan.binder.name); }
        catch { P.toast("Saved to your collection, but it could not go in " + plan.binder.name); }
      }
      if (action === "confirm") { b.textContent = "Saved"; if (!plan) P.toast("Saved"); loadMyData(); }
      const thread = b.closest("[data-mori-thread]");
      if (out.reply && thread) {
        const msg = document.createElement("div");
        msg.className = "cp-mori-msg cp-mori-mori";
        const faceEl = thread.querySelector(".cp-mori-mori .cp-mori-face");
        msg.innerHTML = (faceEl ? faceEl.outerHTML : "") + '<div class="cp-mori-body"><p>' + fmt(out.reply.content) + "</p></div>";
        thread.append(msg);
        msg.scrollIntoView({ block: "end", behavior: "smooth" });
      }
      // What to do next after each kind of confirmed card.
      const NEXT = {
        add_card_to_collection: ["Which binder should it go in?", "Log a memory about this card", "Price check this card"],
        add_to_wishlist: ["Set a buy order for this card", "Price check this card", "What else should I chase?"],
        create_binder: ["Plan a video of this binder", "Which collectors share my taste?", "Build another binder"],
        save_memory: ["Log another memory", "Plan a video of my collection", "What card should I chase next?"],
      };
      const tool = proposals.get(id);
      if (action === "confirm" && NEXT[tool] && P.nextUpHTML) {
        const last = thread && [...thread.querySelectorAll(".cp-mori-mori .cp-mori-body")].pop();
        const next = plan ? ["Plan a video of this binder", "Price check this card", "Add another card"] : NEXT[tool];
        if (last) last.insertAdjacentHTML("beforeend", P.nextUpHTML(next));
      }
      if (action === "confirm" && order) {
        orders.delete(id);
        afterOrderConfirm(order, out.order_status, confirmOwner);
      }
      if (action === "edit") {
        // Other proposals: Mori asks what to change, and the next message makes a new card.
        b.textContent = "Changing";
        P.toast("Tell Mori what to change");
        const q = document.querySelector("[data-mori-input]") || document.querySelector("#cp-app [data-screen='mori'] input[type='text'], #cp-app [data-screen='mori'] textarea");
        if (q) q.focus();
      }
    } catch {
      box.querySelectorAll("button").forEach((x) => (x.disabled = false));
      P.toast("Could not save that. Please try again.");
    }
  });
})();
</script>
